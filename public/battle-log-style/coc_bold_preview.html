<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoC Leaderboard — Reference Matched</title><link rel="stylesheet" href="coc_pixel_match.css"></head><body>
<main class="coc-reference" id="reference">
 <nav class="coc-ref-tabs" aria-label="Game tabs"><button class="coc-ref-tab" aria-selected="false">Leaderboard</button><button class="coc-ref-tab" aria-selected="true">Battle Log</button><button class="coc-ref-tab" aria-selected="false">League History</button><button class="coc-ref-tab" aria-selected="false">Town Halls</button><button class="coc-ref-close" aria-label="Tutup panel" title="Tutup">X</button></nav>
 <section class="coc-ref-window" aria-label="Battle log">
  <header class="coc-ref-head"><div class="coc-ref-topline"><div class="coc-ref-banner"></div><div class="coc-ref-player">#11 Kyuraa</div><div class="coc-ref-total">Total: <strong>1110</strong> <span class="coc-ref-trophy">🏆</span></div><div class="coc-ref-views"><button class="coc-ref-view" id="listView" aria-pressed="false" aria-label="Tampilan daftar">☰</button><button class="coc-ref-view" id="gridView" aria-pressed="true" aria-label="Tampilan kotak"><span class="coc-ref-tiles-icon"><i></i><i></i><i></i><i></i></span></button></div></div><div class="coc-ref-stats"><div class="coc-ref-stat"><span>Attacks</span><span class="coc-ref-num">+844 <span>🏆</span></span></div><div class="coc-ref-stat"><span>Defenses</span><span class="coc-ref-num">+266 <span>🏆</span></span></div></div></header>
  <div id="battleGrid" class="coc-ref-grid" aria-label="Riwayat battle"></div>
 </section><div class="coc-ref-closed" id="closed">Panel ditutup — muat ulang halaman untuk membuka lagi.</div>
</main>
<script>
const scores=[40,22,32,32,40,40,13,0,0,0,28,0, 40,18,40,40,27,40,13,0,27,26,0,16, 40,40,40,40,40,25,0,0,26,12,13,0, 26,40,22,40,40,40,26,17,0,27,11,11];
const stars=[3,2,2,2,3,3,2,3,3,3,1,3, 3,2,3,3,2,3,2,3,1,1,3,2, 3,3,3,3,3,2,3,3,1,1,2,3, 2,3,2,3,3,3,1,1,3,1,0,0];
const gold=new Set([0,4,5,12,14,15,17,24,25,26,27,28,37,39,40,41]);
const red=new Set([7,8,9,19,22,30,31,35,44]);
function star(active){return `<span class="coc-ref-star"><svg viewBox="0 0 35 35" aria-hidden="true"><path d="M17.5 2.2 22.5 12l10.8 1.5-7.9 7.6 1.9 10.8-9.8-5.1-9.8 5.1 1.9-10.8-7.9-7.6L12.5 12Z" fill="${active?'#a3c7d8':'#8f8b8c'}" stroke="#373435" stroke-width="2.1" stroke-linejoin="round"/><path d="M17.5 5.8 21 14l8.5 1-6.2 6 1.3 7.1-7.1-3.9-7.1 3.9 1.3-7.1-6.2-6 8.5-1Z" fill="${active?'#bedce7':'#a29c9d'}" opacity=".7"/></svg></span>`}
const grid=document.getElementById('battleGrid');scores.forEach((v,i)=>{const el=document.createElement('button');el.type='button';el.className='coc-ref-card '+(gold.has(i)?'gold':red.has(i)?'red':i>45?'blue':'')+(i>45?' no-stars':'');el.title=`Pertempuran ${i+1}: ${v} trofi`;el.innerHTML=`<div class="coc-ref-score">${v?'+'+v:'0'} <span class="tiny-trophy">🏆</span></div>${i>45?'':`<div class="coc-ref-stars">${[0,1,2].map(n=>star(n<stars[i])).join('')}</div>`}`;grid.appendChild(el)});
document.querySelectorAll('.coc-ref-tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.coc-ref-tab').forEach(t=>t.setAttribute('aria-selected',String(t===b)))}));
const root=document.getElementById('reference');document.getElementById('listView').onclick=()=>{root.classList.add('coc-ref-list');document.getElementById('listView').setAttribute('aria-pressed','true');document.getElementById('gridView').setAttribute('aria-pressed','false')};document.getElementById('gridView').onclick=()=>{root.classList.remove('coc-ref-list');document.getElementById('listView').setAttribute('aria-pressed','false');document.getElementById('gridView').setAttribute('aria-pressed','true')};document.querySelector('.coc-ref-close').onclick=()=>{document.querySelector('.coc-ref-window').style.display='none';document.getElementById('closed').style.display='flex'};
</script></body></html>
